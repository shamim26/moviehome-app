name: Build & Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare env.json
        run: |
          if [ -n "${{ secrets.ENV_JSON }}" ]; then
            echo '${{ secrets.ENV_JSON }}' > env.json
          else
            echo '{"TMDB_API_KEY":""}' > env.json
          fi

      - name: Setup Release Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/moviehome-release.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=moviehome-release.jks
          EOF

      - name: Build Split-per-ABI Release APKs (~35MB)
        run: flutter build apk --release --split-per-abi --dart-define-from-file=env.json

      - name: Build Universal Release APK (~98MB)
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Rename Artifacts for Distribution
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/MovieHome-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MovieHome-Universal.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/MovieHome-arm64-v8a.apk
            build/app/outputs/flutter-apk/MovieHome-Universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
